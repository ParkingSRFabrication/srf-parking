<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Railway Track Embellishment -->
  <g opacity="0.25" stroke="#94A3B8" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="410" x2="432" y2="410" />
    <line x1="80" y1="434" x2="432" y2="434" />
    <line x1="120" y1="400" x2="120" y2="444" />
    <line x1="170" y1="400" x2="170" y2="444" />
    <line x1="220" y1="400" x2="220" y2="444" />
    <line x1="270" y1="400" x2="270" y2="444" />
    <line x1="320" y1="400" x2="320" y2="444" />
    <line x1="370" y1="400" x2="370" y2="444" />
  </g>

  <!-- Glowing Central Icon (P + Vehicle + Railway Badge) -->
  <g filter="url(#shadow)">
    <!-- Parking 'P' Emblem -->
    <path d="M168 120 H284 C332 120 368 152 368 200 C368 248 332 280 284 280 H232 V360 H168 Z M232 176 V224 H280 C296 224 308 214 308 200 C308 186 296 176 280 176 Z" fill="url(#glow)" />
    <!-- Electric Live Pulse Dot -->
    <circle cx="376" cy="136" r="24" fill="#10B981" />
    <circle cx="376" cy="136" r="14" fill="#FFFFFF" />
  </g>

  <!-- Station Code Badge -->
  <rect x="160" y="380" width="192" height="42" rx="12" fill="#0F172A" stroke="url(#accent)" stroke-width="2" />
  <text x="256" y="408" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="3" text-anchor="middle">SRF • RAIL</text>
</svg>
